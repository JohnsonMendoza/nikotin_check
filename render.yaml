# Render Blueprint: бесплатный Web Service для бота в режиме webhook.
# Использование: Render Dashboard → New → Blueprint → выбрать репозиторий.
# После создания обязательно заполнить BOT_TOKEN и WEBHOOK_BASE_URL в разделе Environment.
#
# ВНИМАНИЕ: у бесплатного тарифа эфемерная файловая система — SQLite обнуляется
# при перезапуске/засыпании сервиса. Для сбора данных для курсового используй VPS
# или PythonAnywhere (см. README.md, раздел 6).

services:
  - type: web
    name: dishi-svobodno-bot
    runtime: python
    plan: free
    rootDir: nicotine_free_bot
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false          # задаётся вручную в панели, в репозиторий не попадает
      - key: MODE
        value: webhook
      - key: WEBHOOK_BASE_URL
        sync: false          # https://имя-сервиса.onrender.com
      - key: CRON_KEY
        generateValue: true  # Render сгенерирует случайную строку
      - key: TIMEZONE
        value: Europe/Moscow
      - key: DEFAULT_NOTIFY_HOUR
        value: "9"
      - key: ADMIN_ID
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
